<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Fractals</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Prism CSS -->
    <link rel="stylesheet" href="styles/prism.css" />
    <!-- CSS -->
    <link rel="stylesheet" href="styles/index.css" />
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom mb-3">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Fractal Generator</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Documentation</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Blocks Reference</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Pop-up Toast container -->
    <div class="position-fixed start-50 translate-middle-x p-3" style="top: 150px; z-index: 1100">
        <div id="workspaceToast" class="toast align-items-center text-bg-primary border-0" role="alert"
            aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toast-message">
                    Workspace saved!
                </div>
            </div>
        </div>
    </div>

    
    <div class="container-fluid p-4">
        <!-- Buttons -->
        <div class="d-flex align-items-center gap-2 mb-3">
            <button id="run" class="btn btn-success">Run</button>
            <button id="reset" class="btn btn-secondary">Reset</button>
            <button id="toggle-code-view" class="btn btn-outline-primary">Show Code</button>
            <button id="save" class="btn btn-outline-success">Save</button>
            <button id="load" class="btn btn-outline-warning">Load</button>
        </div>

        <div class="row">
            <!-- Canvas -->
            <div class="col-md-6 mb-3">
                <div id="canvas-area" class="border bg-light p-2" style="height: 800px;"></div>
            </div>

            <!-- Blockly/Code Toggle Area -->
            <div class="col-md-6 mb-3">
                <div id="blocklyDiv" class="border" style="height: 800px;"></div>
                <div id="codeDiv" class="d-none" style="height: 800px; overflow: auto;"></div>
                <div id="customTooltip" style="position: absolute; display: none; z-index: 1000;"></div>
            </div>
        </div>
    </div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Prism.js -->
    <script src="scripts/prism.js"></script>

    <!-- p5.js -->
    <script src="p5/p5.min.js"></script>

    <!-- Blockly -->
    <script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
    <script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
    <script src="https://unpkg.com/blockly/javascript_compressed.js"></script>
    <script src="https://unpkg.com/blockly/msg/en.js"></script>

    <!-- Fractal class -->
    <script src="scripts/fractals/tree_fractal.js"></script>
    <script src="scripts/fractals/sierpniski_triangle.js"></script>
    <script src="scripts/fractals/koch_snowflake.js"></script>
    <script src="scripts/fractals/cantor_set.js"></script>
    <script src="scripts/fractals/mandelbrot_set.js"></script>
    <script src="scripts/fractals/dragon_curve.js"></script>
    <script src="scripts/fractals/barnsley_fern.js"></script>

    <!-- Blockly categories-->
    <script src="scripts/blocks/blocks_structure.js"></script>
    <script src="scripts/blocks/blocks_math.js"></script>
    <script src="scripts/blocks/blocks_tree_fractal.js"></script>
    <script src="scripts/blocks/blocks_sierpniski_triangle.js"></script>
    <script src="scripts/blocks/blocks_koch_snowflake.js"></script>
    <script src="scripts/blocks/blocks_cantor_set.js"></script>
    <script src="scripts/blocks/blocks_mandelbrot_set.js"></script>
    <script src="scripts/blocks/blocks_dragon_curve.js"></script>
    <script src="scripts/blocks/blocks_barnsley_fern.js"></script>

    <!-- Core app logic -->
    <script type="module" src="scripts/core/app.js"></script>

</body>

</html>
